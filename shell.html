<title>Reliance CFE Manager</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: role-based operations platform. Top bar with role switcher, left nav per role, light working canvas, narration bar for demos. Single light theme by choice. */
:root{
  color-scheme:light;
  --bg:#F2F4F6; --panel:#FFFFFF; --panel-2:#F7F9FA; --panel-3:#EEF2F5;
  --ink:#0F1E2D; --ink-2:#2A3A4A; --muted:#5E6D7B; --faint:#8994A0; --line:#DAE0E6; --line-2:#E9EDF1;
  --brand:#143D6B; --brand-ink:#FFFFFF; --brand-soft:#E6EDF6; --brand-2:#2D5F99;
  --solar:#D88B00; --wind:#2A8BA7; --bess:#6A4EC4; --bess-x:#C2B7E6; --mkt:#4E8FDB; --grid:#8F99A3; --excl:#D3D9DE; --load:#0F1E2D;
  --good:#16774C; --good-bg:#E1F2E9; --warn:#8C5900; --warn-bg:#FBEFD6; --crit:#B0271E; --crit-bg:#FAE4E1; --info:#2C4A88; --info-bg:#E7ECF7;
  --r-manager:#143D6B; --r-customer:#0E7568; --r-supplier:#B36A00; --r-trader:#3B6CCB; --r-verifier:#6A4EC4;
  --h0:#F1D6BC; --h1:#E9C27A; --h2:#A9CDB9; --h3:#3E9C86; --h4:#0F6158;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(15,30,45,.06),0 4px 14px rgba(15,30,45,.05);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.005em;text-wrap:balance;color:var(--ink)}
h1{font-size:28px;line-height:1.1} h2{font-size:21px;line-height:1.2} h3{font-size:17px} h4{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono)} .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.brand .t{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.05;white-space:nowrap}
.brand .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
.simtag{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--warn);background:var(--warn-bg);border:1px dashed #D9B261;border-radius:4px;padding:2px 7px}
.roles{display:flex;gap:4px;background:var(--panel-3);padding:3px;border-radius:9px;overflow-x:auto;max-width:100%}
.role{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px}
.role .dot{width:8px;height:8px;border-radius:50%;flex:none}
.role[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--brand-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--crit);border-color:#E7B7B2}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* layout */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:61px;align-self:start;height:calc(100vh - 61px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.who{padding:10px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line-2)}
.who .n{font-weight:600;font-size:13px;line-height:1.3}
.who .r{font-size:11.5px;color:var(--muted)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;color:var(--ink-2);text-decoration:none;cursor:pointer;font-weight:500}
.nav a:hover{background:var(--panel-3)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.nav a svg{flex:none}
.side .foot{margin-top:auto;font-size:11px;color:var(--faint);font-family:var(--f-mono);padding:0 8px;line-height:1.5}
main{min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1280px;margin:0 auto;display:grid;gap:16px}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.phead .lead{color:var(--muted);max-width:68ch;margin-top:4px}
@media (max-width:900px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}.nav{display:flex;flex-wrap:wrap}.side .foot,.who{display:none}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel.flat{box-shadow:none}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:12px;flex-wrap:wrap}
.ph .sub{font-size:12.5px;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g21{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:16px}
@media (max-width:1050px){.g2,.g3,.g21,.g12{grid-template-columns:1fr}}
.stack{display:grid;gap:12px;align-content:start}
.row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;display:grid;gap:1px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.tone-good{border-left:3px solid var(--good)} .kpi.tone-crit{border-left:3px solid var(--crit)} .kpi.tone-warn{border-left:3px solid #D9A23A}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.75;font-family:var(--f-body)}
.chip.good{color:var(--good);background:var(--good-bg)} .chip.warn{color:var(--warn);background:var(--warn-bg)} .chip.crit{color:var(--crit);background:var(--crit-bg)} .chip.info{color:var(--info);background:var(--info-bg)} .chip.neutral{color:var(--muted);background:var(--panel-3)}
.chip.sim{color:var(--warn);background:var(--warn-bg);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em}
.dotk{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline;flex:none}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:11.5px;background:var(--panel-2);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right} td.c,th.c{text-align:center}
td.wrap{white-space:normal;min-width:220px}
tbody tr:last-child td{border-bottom:0}
tr.sel td{background:var(--brand-soft)}
tbody.click tr{cursor:pointer} tbody.click tr:hover td{background:var(--panel-2)} tbody.click tr.sel:hover td{background:var(--brand-soft)}
.ok{color:var(--good);font-weight:700} .no{color:var(--crit);font-weight:700} .pend{color:var(--warn);font-weight:700}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.form .full{grid-column:1/-1}
@media (max-width:700px){.form{grid-template-columns:1fr}}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.fld .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--panel);min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
input[type=range]{width:100%;accent-color:var(--brand)}
.radios{display:flex;gap:6px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
.radios label:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.radios input{accent-color:var(--brand)}
.upload{border:1.5px dashed var(--line);border-radius:8px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--panel-2)}

/* wizard */
.steps{display:flex;gap:0;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.step{flex:1;min-width:120px;padding:10px 14px;border-right:1px solid var(--line-2);display:grid;gap:1px;cursor:pointer;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.step:last-child{border-right:0}
.step .n{font-family:var(--f-mono);font-size:10.5px;color:var(--faint)}
.step .t{font-weight:500;font-size:13px;color:var(--muted)}
.step.done .t{color:var(--ink-2)} .step.done .n{color:var(--good)}
.step[aria-current="step"]{background:var(--brand-soft)} .step[aria-current="step"] .t{color:var(--brand);font-weight:600}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);flex-wrap:wrap}

/* gates */
.gates{display:grid;gap:6px}
.gate{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel)}
.gate .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px}
.gate.pass .ic{background:var(--good-bg);color:var(--good)} .gate.fail .ic{background:var(--crit-bg);color:var(--crit)} .gate.wait .ic{background:var(--panel-3);color:var(--faint)}
.gate .d{font-size:12px;color:var(--muted)}
.gate.fail{border-color:#EDC4BF;background:#FFF9F8}
.gate.anim{animation:gin .35s ease-out both}
@keyframes gin{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto}
svg text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.legend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.zero{font-family:var(--f-mono);font-size:10px;color:var(--crit);margin-left:3px;font-weight:600}
.wm{position:absolute;right:10px;bottom:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--warn);opacity:.75;pointer-events:none}

/* control room map */
.flow{fill:none;stroke-linecap:round}
.flow.anim{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
.dataline{fill:none;stroke:var(--faint);stroke-dasharray:2 4;stroke-width:1.2}
@media (prefers-reduced-motion:reduce){.flow.anim{animation:none}.gate.anim{animation:none}}
.node rect{stroke-width:1.2}
.node text.t{font-family:var(--f-body);font-size:14px;font-weight:600;fill:var(--ink)}
.node text.s{font-size:11.5px}
.node text.v{font-family:var(--f-display);font-size:17px;font-weight:600;fill:var(--ink)}
.clickable{cursor:pointer}
.clickable:hover rect{stroke:var(--brand-2)}

/* timeline / sequence */
.seqwrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:8px;background:var(--panel)}
.seqwrap svg{min-width:880px}

/* misc */
.callout{border:1px solid var(--line);border-left:3px solid var(--brand-2);background:var(--panel-2);border-radius:8px;padding:10px 12px;font-size:13px}
.callout.warn{border-left-color:#D9A23A} .callout.crit{border-left-color:var(--crit)} .callout.good{border-left-color:var(--good)}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
ul.plain{margin:0;padding-left:18px;display:grid;gap:3px}
.big{font-family:var(--f-display);font-weight:600;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--panel-3)}
.bar span{display:block;height:100%}
.meter{position:relative;height:10px;background:var(--panel-3);border-radius:5px}
.meter .f{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--brand)}
.meter .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.kanban{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.kcol .kh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kcol .kh .eyebrow{font-size:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:3px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--brand-2)}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.card .t{font-weight:600;font-size:13px;line-height:1.3}
.card .m{font-size:11.5px;color:var(--muted)}
.card.new{border-style:dashed;border-color:var(--r-customer)}
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.link{padding:12px 14px;border-right:1px solid var(--line-2);display:grid;gap:4px;align-content:start;position:relative;background:var(--panel);min-width:0}
.link:last-child{border-right:0}
.link .st{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.link .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.link.pass .ic{background:var(--good-bg);color:var(--good)} .link.wait .ic{background:var(--warn-bg);color:var(--warn)} .link.fail .ic{background:var(--crit-bg);color:var(--crit)}
.link .lw{font-size:11.5px;color:var(--muted)}
.link .d{font-size:12px;font-family:var(--f-mono);color:var(--ink-2);overflow-wrap:anywhere}
@media (max-width:900px){.chain{grid-template-columns:1fr}.link{border-right:0;border-bottom:1px solid var(--line-2)}}
.ledgers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.ledgers{grid-template-columns:1fr}}
.ledger{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel)}
.ledger h4{display:flex;gap:8px;align-items:center}
.ledger .row2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed var(--line-2)}
.ledger .row2:last-child{border-bottom:0}
.ledger .row2 span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.msgs{display:grid;gap:8px;max-height:420px;overflow:auto}
.msg{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 10px;padding:9px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel)}
.msg .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.msg .tx{font-size:13px}
.msg .tx b{font-weight:600}
.msg .rt{grid-column:2;font-size:11.5px;color:var(--muted)}
.actor{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;padding:0 6px;margin-right:6px;font-family:var(--f-mono);letter-spacing:.02em}
.hl{outline:3px solid #E7A93A;outline-offset:3px;border-radius:10px;transition:outline-color .3s}

/* what-if + block view + onboarding */
.scens{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.scen{display:grid;gap:1px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);cursor:pointer}
.scen b{font-weight:600;font-size:13px}
.scen span{font-size:11.5px;color:var(--muted);line-height:1.35}
.scen:hover{border-color:var(--crit)}
.scen[aria-pressed="true"]{border-color:var(--crit);background:var(--crit-bg)}
.scen[aria-pressed="true"] b{color:var(--crit)}
.fl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.7fr) minmax(0,1fr);gap:16px}
@media (max-width:1200px){.fl{grid-template-columns:1fr}}
.fsteps{display:grid;gap:8px}
.fstep{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);transition:opacity .35s,box-shadow .35s,border-color .35s}
.fstep .fn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:700;background:var(--panel-3);color:var(--muted)}
.fstep .fh{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fstep.pending{opacity:.5;background:var(--panel-2)}
.fstep.active{border-color:var(--brand-2);box-shadow:0 0 0 4px var(--brand-soft)}
.fstep.done.st-fired .fn{background:var(--good-bg);color:var(--good)} .fstep.done.st-short .fn{background:var(--warn-bg);color:var(--warn)} .fstep.done.st-charging .fn{background:var(--info-bg);color:var(--info)} .fstep.done.st-out .fn{background:var(--crit-bg);color:var(--crit)} .fstep.done.st-zero .fn{background:var(--panel-3);color:var(--ink)}
.fstep.active.st-fired .fn,.fstep.active.st-short .fn,.fstep.active.st-charging .fn,.fstep.active.st-out .fn,.fstep.active.st-zero .fn,.fstep.active.st-idle .fn{background:var(--brand);color:#fff}
.fv{display:grid;justify-items:end;gap:4px}
.fv .mw{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.fv .mw small{font-size:13px;color:var(--muted);font-weight:500}
.logline{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}

/* ===== v4 product shell ===== */
:root{--side-bg:#0E2742;--side-ink:#C3D2E3;--side-faint:#7F97B2;--side-hover:rgba(255,255,255,.07);--side-on:rgba(255,255,255,.12);--gold:#FFD58A}

/* tighter page heads */
h1{font-size:25px}

.nowbar{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--panel-3)}

.home{max-width:1180px;margin:0 auto;display:grid;gap:22px;padding-block:8px 20px}

@media (prefers-reduced-motion:reduce){.door{transition:none}.door:hover{transform:none}}


/* ===== v5: story, judge demo ===== */
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

.pend-chip{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.03em;color:var(--warn);background:var(--warn-bg);border:1px dashed #D9B261;border-radius:4px;padding:0 6px;white-space:nowrap}
.promise{border:1px solid #CFE0F2;background:#F2F7FC;border-left:4px solid var(--brand);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}

.stg.wait{border-style:dashed}

@media (max-width:760px){.stages{grid-template-columns:1fr}.stg .arr{display:none}}
.brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

@media (max-width:1000px){.brief{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.brief{grid-template-columns:1fr}}
.trace{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}

@media (max-width:1100px){.trace{grid-template-columns:repeat(3,minmax(0,1fr))}.tstep:nth-child(3){border-right:0}.tstep:nth-child(-n+3){border-bottom:1px solid var(--line-2)}}
@media (max-width:600px){.trace{grid-template-columns:1fr}.tstep{border-right:0;border-bottom:1px solid var(--line-2)}}

.rv-clock{font-family:var(--f-mono);font-size:64px;font-weight:600;color:var(--brand);line-height:1}
.rv-clock.crit{color:var(--crit)}
.rv-h{font-size:46px;line-height:1.08;font-weight:700;letter-spacing:-.005em}
.rv-sub{font-size:30px;line-height:1.25;font-weight:500;color:var(--ink-2)}
.rv-kicker{font-family:var(--f-mono);font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rv-note{font-size:19px;color:var(--muted);max-width:46ch}
.rv-list{display:grid;gap:8px}
.rv-row{display:grid;grid-template-columns:16px minmax(0,1fr) 150px 170px 24px;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:18px}
.rv-row b{font-weight:600}
.rv-row .mono{font-size:15px;color:var(--ink-2)}
.rv-steps{display:grid;gap:12px}
.rv-step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rv-step .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:700;font-size:16px}
.rv-step b{font-size:21px;font-weight:600}
.rv-step span span{font-size:17px;color:var(--muted)}
.rv-chart{align-self:center}
.rv-chart svg{width:100%;height:auto}
.rv-chart svg text{font-size:13px}
.sweep{transform-box:fill-box;transform-origin:right;animation:sweep 3.2s ease-in-out .6s both}
@keyframes sweep{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.rv-bars{display:grid;gap:14px}
.rv-bar{display:grid;grid-template-columns:230px minmax(0,1fr) 110px;gap:14px;align-items:center;font-size:20px}
.rv-bar b{font-family:var(--f-display);font-size:28px;text-align:right;font-variant-numeric:tabular-nums}
.rv-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rv-kpis div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid}
.rv-kpis span{font-size:16px;color:var(--muted)}
.rv-kpis b{font-family:var(--f-display);font-size:40px;font-weight:600}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 1.2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(2.4);opacity:0}}
.rv-shots{position:relative;height:100%}
.rv-shot{position:absolute;inset:0 0 70px 0;background:var(--bg);display:grid;grid-template-rows:minmax(0,1fr);justify-items:center}
.rv-frame{width:1240px;max-width:100%;height:100%;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg);box-shadow:0 20px 50px rgba(15,30,45,.14)}
.rv-inner{width:1550px;transform:scale(.8);transform-origin:top left;padding:20px}
.rv-inner .page{max-width:none}
.rv-shotcap{font-size:26px;font-weight:600;color:var(--ink)}
.rv-proof{display:grid;gap:26px;align-content:center;height:100%}
.rv-chain{display:flex;align-items:stretch;gap:10px}
.rv-link{flex:1;display:grid;gap:8px;align-content:start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.rv-link .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--good-bg);color:var(--good);font-weight:700}
.rv-link.wait .ic{background:var(--warn-bg);color:var(--warn)}
.rv-link b{font-size:21px;font-weight:600;line-height:1.2}
.rv-link span{font-size:16px;color:var(--muted)}
.rv-arrow{align-self:center;color:var(--faint);font-size:26px}
.proofstage .stg b{font-size:18px}
.proofstage .stg .small{font-size:15px}
.rv-close{height:100%;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center}
.rv-close .logo{background:var(--brand);display:grid;place-items:center}
.rv-close h1{font-size:84px;font-weight:700}
.rv-tag{font-size:36px;color:var(--brand);font-weight:600}
@media (prefers-reduced-motion:reduce){.rv{transition:none}.sweep{animation:none;display:none}.ping{animation:none}}

/* narration bar */
.narr{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;width:min(980px,calc(100% - 32px));background:var(--ink);color:#F4F7FA;border-radius:12px;box-shadow:0 10px 30px rgba(15,30,45,.25);padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:center}
.narr .k{font-family:var(--f-mono);font-size:11px;color:#9FB2C6;white-space:nowrap}
.narr .cap{font-size:14.5px;line-height:1.45}
.narr .cap b{color:#FFD58A;font-weight:600}
.narr .ctl{display:flex;gap:6px}
.narr .btn{background:#22344A;border-color:#33485F;color:#F4F7FA}
.narr .btn:hover{border-color:#8EB4E6}
.narr .btn.primary{background:#E8EEF6;color:var(--ink);border-color:#E8EEF6}
.narr .prog{grid-column:1/-1;height:3px;background:#2A3D52;border-radius:2px;overflow:hidden}
.narr .prog span{display:block;height:100%;background:#FFD58A;width:0}
@media (max-width:700px){.narr{grid-template-columns:1fr}.narr .ctl{justify-content:flex-end}}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,30,45,.32);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--panel);padding:20px max(20px,env(safe-area-inset-right,0px)) 20px 20px;overflow:auto;display:grid;gap:14px;align-content:start;box-shadow:-10px 0 30px rgba(15,30,45,.15)}
.uc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--panel);text-align:left}
.uc:hover{border-color:var(--brand-2);background:var(--panel-2)}
.uc .id{font-family:var(--f-mono);font-size:11px;color:var(--brand);font-weight:600}
.uc .t{font-weight:600}
.uc .d{grid-column:2;font-size:12.5px;color:var(--muted)}
.uc .ar{grid-row:1/3;grid-column:3;color:var(--faint)}
.toast{position:fixed;top:76px;right:20px;z-index:60;background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:360px}
</style>
